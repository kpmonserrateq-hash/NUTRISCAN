<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan | Redirecting...</title>
  <script>
    // GitHub Pages 404 redirect handler para SPA
    const path = window.location.pathname;
    const pathWithoutRepo = path.replace(/^\/NUTRISCAN/, '');
    const queryString = window.location.search;
    
    // Si hay un path específico (no es raíz), convertirlo a hash
    if (pathWithoutRepo && pathWithoutRepo !== '/' && pathWithoutRepo !== '') {
      // Redirige a index.html con la ruta como hash
      window.location.replace('/NUTRISCAN/#' + pathWithoutRepo.substring(1) + queryString);
    } else {
      // Si es raíz, ir a index.html
      window.location.replace('/NUTRISCAN/' + queryString);
    }
  </script>
</head>
<body>
  <p>Redirigiendo...</p>
</body>
</html>
